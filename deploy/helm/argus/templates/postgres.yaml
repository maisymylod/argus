apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  labels:
    {{- include "argus.labels" . | nindent 4 }}
    app: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.db | quote }}
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: initdb
          configMap:
            name: argus-db-init
---
apiVersion: v1
kind: Service
metadata:
  name: db
  labels:
    {{- include "argus.labels" . | nindent 4 }}
spec:
  selector:
    app: db
  ports:
    - port: 5432
      targetPort: 5432
