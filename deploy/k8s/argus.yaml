# Plain-manifest equivalent of the Helm chart defaults, for `kubectl apply`.
# Apply into a namespace, e.g.:
#   kubectl create namespace argus
#   kubectl -n argus apply -f deploy/k8s/argus.yaml
# The Helm chart (deploy/helm/argus) is the parameterized source of truth.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argus-gateway-env
data:
  LOG_LEVEL: "INFO"
  STAC_URL: "https://planetarycomputer.microsoft.com/api/stac/v1"
  ANTHROPIC_MODEL: "claude-sonnet-4-6"
  ANTHROPIC_MODEL_HEAVY: "claude-opus-4-8"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argus-db-init
data:
  01-extensions.sql: |
    CREATE EXTENSION IF NOT EXISTS vector;
---
apiVersion: v1
kind: Secret
metadata:
  name: argus-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql://argus:change-me-locally@db:5432/argus"
  ANTHROPIC_API_KEY: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  labels:
    app: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          env:
            - name: POSTGRES_USER
              value: "argus"
            - name: POSTGRES_PASSWORD
              value: "change-me-locally"
            - name: POSTGRES_DB
              value: "argus"
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "argus"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: initdb
          configMap:
            name: argus-db-init
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector:
    app: db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: argus-gateway:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: argus-gateway-env
            - secretRef:
                name: argus-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: gateway
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: argus-web:local
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
